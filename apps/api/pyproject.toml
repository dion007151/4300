[project]
name = "forfree-api"
version = "0.2.0"
description = "FastAPI backend for 4300."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "python-multipart>=0.0.12",
  "sqlmodel>=0.0.22",
  "psycopg2-binary>=2.9.9",
  "pyjwt>=2.8.0"
]

[project.optional-dependencies]
ai = [
  "openai>=1.40.0",
  "anthropic>=0.34.0"
]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "pytest-asyncio>=0.23.0"
]

[tool.ruff]
line-length = 100
