[project]
name = "forfree-api"
version = "0.2.0"
description = "FastAPI backend for 4300."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "python-multipart>=0.0.12"
]

[project.optional-dependencies]
# Install AI providers with: pip install .[ai]
ai = [
  "openai>=1.40.0",
  "anthropic>=0.34.0"
]

[tool.ruff]
line-length = 100
